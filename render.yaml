# =============================================================================
#  MANYAK TV v2 — Render.com Blueprint
# =============================================================================

databases:
  - name: manyaktv-db
    databaseName: manyaktv
    user: manyaktv
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"

services:
  # ─── Redis
  - type: redis
    name: manyaktv-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # ─── NestJS Backend (Node runtime — Dockerfile shart emas)
  - type: web
    name: manyaktv-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: manyaktv-v2/apps/api
    buildCommand: npm install && npm run build
    startCommand: node dist/main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: manyaktv-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: manyaktv-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: SUPER_ADMIN_ID
        sync: false
      - key: ADMIN_BROWSER_SECRET
        sync: false
      - key: FILE_SIGNING_SECRET
        sync: false
      - key: UPLOADS_DIR
        value: /tmp/uploads
      - key: HLS_OUTPUT_DIR
        value: /tmp/hls-output
      - key: HLS_AUTH_CACHE_TTL
        value: "30"
      - key: DB_POOL_MIN
        value: "2"
      - key: DB_POOL_MAX
        value: "10"

  # ─── Angular Frontend (Static Site)
  - type: web
    name: manyaktv-web
    runtime: static
    region: frankfurt
    rootDir: manyaktv-v2/apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist/web/browser
    pullRequestPreviewsEnabled: false
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
