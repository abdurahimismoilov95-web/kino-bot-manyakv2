# =============================================================================
#  MANYAK TV v2 — Nginx HLS Streaming + Auth + Static
# =============================================================================

server {
    listen 80;
    server_name _;

    # ─── Internal: NestJS HLS token auth sub-request ──────────────────────
    location = /_internal/stream-auth {
        internal;
        proxy_pass         http://nestjs_api/api/v1/streaming/auth;
        proxy_pass_request_body off;
        proxy_set_header   Content-Length "";
        proxy_set_header   X-Original-URI $request_uri;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ===========================================================================
    #  HLS Stream Delivery
    #
    #  Foydalanuvchi: GET /hls/{contentId}/master.m3u8?uid=X&exp=Y&sig=Z
    #  1) nginx auth_request => NestJS /api/v1/streaming/auth (token tekshirish)
    #  2) 200 bo'lsa => /var/www/hls/{contentId}/master.m3u8 faylni qaytaradi
    #  3) 403/401 => streaming rad etiladi
    #
    #  BU YO'L HTTP Range'dan YAXSHIROQ:
    #   ✓ Nginx o'zi sendfile() va zero-copy ishlatadi
    #   ✓ .ts segment'lar kichik (~2-10s) => memory load yo'q
    #   ✓ Quality selector: master.m3u8 ichida 480p/720p/1080p playlist
    #   ✓ Token expire bo'lsa stream to'xtaydi (anti-piracy)
    # ===========================================================================
    location /hls/ {
        limit_req zone=hls burst=50 nodelay;

        # ── Token authentication ──
        auth_request /_internal/stream-auth;

        # auth_request parametrlarini sub-request'ga o'tkazish
        auth_request_set $auth_status $upstream_status;
        error_page 401 403 = @stream_forbidden;

        alias /var/www/hls/;

        # HLS-specific headers
        add_header Cache-Control         "no-cache, no-store";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Headers "Range";
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range";

        # .m3u8 playlist'larni cache'lamaslik
        location ~* \.m3u8$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma        "no-cache";
            add_header Expires       "0";
        }

        # .ts segmentlarni qisqa muddatga cache'lash
        location ~* \.ts$ {
            add_header Cache-Control "public, max-age=600";
        }
    }

    location @stream_forbidden {
        return 403 '{"error":"Stream access denied or token expired"}';
    }

    # ===========================================================================
    #  Static Uploads (poster, banner, receipt image)
    #  /uploads/* fayllar himoyasiz (poster va bannerlar public)
    #  /uploads/receipts/* fayllar FAQAT admin ko'rishi kerak (keyingi versiyada)
    # ===========================================================================
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # ===========================================================================
    #  NestJS API Proxy
    # ===========================================================================
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass         http://nestjs_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # SSE uchun buffering o'chirish
        proxy_buffering    off;
        proxy_cache        off;
    }

    # ===========================================================================
    #  Angular Web App (SPA)
    # ===========================================================================
    location / {
        root /var/www/angular;
        try_files $uri $uri/ /index.html;   # SPA deep-link support
        expires 1h;
        add_header Cache-Control "public, no-cache";
    }

    # ── Angular static assets (hashed filenames) ──
    location ~* \.(js|css|woff2|woff|ttf|eot|svg|ico|png|jpg|webp)$ {
        root /var/www/angular;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
