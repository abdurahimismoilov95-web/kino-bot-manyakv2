# =============================================================================
#  MANYAK TV v2 — Nginx main config
#  HLS streaming: nginx faqat .m3u8 va .ts segmentlarni beradi,
#  lekin har bir so'rov oldidan NestJS API orqali token tekshiriladi.
# =============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;       # Bir worker'da maksimal ulanish
    multi_accept on;
    use epoll;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Logging ───────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ─── Performance ───────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         text/plain application/json application/javascript
                       text/css application/x-mpegurl;  # HLS playlist ham compress
    gzip_min_length    1024;

    # ─── Security headers ──────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"   always;
    add_header X-XSS-Protection      "1; mode=block" always;

    # ─── HLS MIME types ────────────────────────────────────────────
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t                    ts;
        video/mp4                     mp4;
        image/jpeg                    jpg jpeg;
        image/webp                    webp;
    }

    # Rate limiting (anti-piracy, anti-scraping)
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=hls:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/m;

    # ─── Upstream: NestJS API ──────────────────────────────────────────
    upstream nestjs_api {
        server api:3001;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
