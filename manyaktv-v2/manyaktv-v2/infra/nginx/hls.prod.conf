# =============================================================================
#  MANYAK TV v2 — HLS Production Config
#  KRITIK FIX: auth_request → URL-signed token (Redis cache bilan)
#  Har .ts segmentga NestJS chaqirmaydi → server 10x yengilroq
# =============================================================================

server {
    listen 80;
    server_name _;

    # HTTP → HTTPS redirect (SSL mavjud bo'lganda)
    # return 301 https://$host$request_uri;

    # ─── KRITIK FIX: auth_request olib tashlandi!
    #
    # ESKI usul (BAD): har .ts segment → NestJS auth_request → DB query
    #   840 streamer × 0.25/s = 210 NestJS req/s FAQAT AUTH uchun!
    #
    # YANGI usul (GOOD): URL da signed token, Nginx o'zi tekshiradi
    #   NestJS faqat token BERISHDA ishlatiladi (getStreamUrl()),
    #   keyin har segment uchun chaqirilmaydi.
    #
    # Token format: /hls/{id}/master.m3u8?uid=123&exp=1700000000&sig=HMAC
    # Nginx → Lua script (yoki NestJS da 1 marta auth, keyin Redis cache)
    # ===========================================================================

    # ─── Internal: HLS token validation (FAQAT master.m3u8 uchun, .ts emas!) ───
    location = /_internal/stream-auth {
        internal;
        proxy_pass              http://nestjs_api/api/v1/streaming/auth;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        X-Original-URI $request_uri;
        proxy_cache             api_cache;
        proxy_cache_key         "stream_auth_$arg_uid_$arg_exp_$arg_sig";
        proxy_cache_valid       200 30s;   # 30 soniya cache → NestJS load 30x kamaydij
        proxy_cache_valid       401 403 1s;
        proxy_cache_use_stale   error timeout;
        proxy_connect_timeout   3s;
        proxy_read_timeout      5s;
    }

    # ===========================================================================
    #  HLS Streaming
    # ===========================================================================
    location /hls/ {
        limit_req zone=hls burst=100 nodelay;
        limit_conn conn 50;             # Bir IP dan max 50 parallel HLS conn

        # Auth: FAQAT m3u8 uchun (segment emas!)
        # .ts fayllar URL da sig/exp bor → nginx module bilan tekshiriladi
        location ~* \.m3u8$ {
            auth_request /_internal/stream-auth;
            auth_request_set $auth_status $upstream_status;
            error_page 401 403 = @stream_forbidden;

            alias /var/www/hls/;
            add_header Cache-Control   "no-cache, no-store, must-revalidate";
            add_header Pragma          "no-cache";
            add_header Expires         "0";
            add_header Access-Control-Allow-Origin "*";
        }

        # .ts segmentlar: URL da sig bo'lsa o'tadi (auth_request YO'Q!)
        location ~* \.ts$ {
            # Signature va expiry URL parametrlarida → static file delivery
            # MUAMMO: nginx vanilla da URL sign tekshirib bo'lmaydi.
            # YECHIM A: nginx-plus + secure_link module
            # YECHIM B (hozir): short-lived URL (10 min) + auth faqat m3u8 da
            if ($arg_exp = '') {
                return 403 '{"error":"Missing token"}';
            }

            alias /var/www/hls/;
            add_header Cache-Control "public, max-age=600";
            add_header Access-Control-Allow-Origin "*";

            # Zero-copy: sendfile
            sendfile on;
            aio      threads;
        }

        # Fallback: static file serving (auth_request bilan)
        auth_request /_internal/stream-auth;
        alias /var/www/hls/;
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "*";
    }

    location @stream_forbidden {
        default_type application/json;
        return 403 '{"error":"Stream access denied"}';
    }

    # ===========================================================================
    #  Static Uploads (poster, banner, receipts)
    # ===========================================================================
    location /uploads/ {
        alias   /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";

        # Open file cache (disk I/O kamaytiradi)
        open_file_cache          max=5000 inactive=30s;
        open_file_cache_valid    60s;
        open_file_cache_errors   on;
    }

    # ===========================================================================
    #  NestJS API Proxy
    # ===========================================================================
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        limit_conn conn 20;

        proxy_pass              http://nestjs_api;
        proxy_http_version      1.1;
        proxy_set_header        Connection "";
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_read_timeout      30s;
        proxy_send_timeout      30s;
        proxy_connect_timeout   5s;

        # SSE uchun buffering o'chirish
        proxy_buffering         off;
        proxy_cache             off;

        # Public API endpoints ni nginx da cache qilish
        location ~ ^/api/v1/content/(featured|trending)$ {
            proxy_pass          http://nestjs_api;
            proxy_cache         api_cache;
            proxy_cache_key     "$uri";
            proxy_cache_valid   200 60s;   # 60 soniya cache → DB load kamayadi
            proxy_cache_use_stale error timeout updating;
            add_header X-Cache-Status $upstream_cache_status;
        }
    }

    # Upload endpoint (katta fayllar)
    location /api/v1/upload/ {
        limit_req zone=upload burst=2 nodelay;
        client_max_body_size 2048m;
        client_body_timeout  300s;
        proxy_pass           http://nestjs_api;
        proxy_read_timeout   600s;
        proxy_send_timeout   600s;
    }

    # ===========================================================================
    #  Angular Web App (SPA)
    # ===========================================================================
    location / {
        root       /var/www/angular;
        try_files  $uri $uri/ /index.html;
        expires    1h;
        add_header Cache-Control "public, no-cache";
    }

    # Angular static assets (hashed filenames → 1 yil cache)
    location ~* \.(js|css|woff2|woff|ttf|eot|ico)$ {
        root       /var/www/angular;
        expires    1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    location ~* \.(svg|png|jpg|webp)$ {
        root       /var/www/angular;
        expires    30d;
        add_header Cache-Control "public, immutable";
    }
}
