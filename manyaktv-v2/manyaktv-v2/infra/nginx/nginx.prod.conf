# =============================================================================
#  MANYAK TV v2 — Nginx PRODUCTION config
#  FIX: worker_connections 4096 → 8192, keepalive 32 → 128
# =============================================================================

worker_processes      auto;
worker_rlimit_nofile  131072;   # FIX: 65535 → 131072
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections  8192;   # FIX: 4096 → 8192 (CPU * 8192 = ~32K concurrent)
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent rt=$request_time';
    access_log /var/log/nginx/access.log main buffer=16k flush=5s;

    # ─── Performance ────────────────────────────────────────────────────
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;
    keepalive_timeout    75;
    keepalive_requests   1000;
    reset_timedout_connection on;

    # ─── Buffers ────────────────────────────────────────────────────────
    client_body_buffer_size     128k;
    client_max_body_size        500m;   # Video upload
    client_header_buffer_size   1k;
    large_client_header_buffers 4 16k;
    output_buffers              1 32k;
    postpone_output             1460;

    # ─── Gzip ───────────────────────────────────────────────────────────
    gzip              on;
    gzip_comp_level   4;
    gzip_types        text/plain application/json application/javascript
                      text/css application/x-mpegurl text/xml;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;

    # ─── Open file cache ────────────────────────────────────────────────
    open_file_cache          max=10000 inactive=60s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # ─── Rate limiting zones ─────────────────────────────────────────────
    # FIX: 30r/s → 100r/s (UZ ISP da ko'p user shared NAT ishlatadi)
    limit_req_zone $binary_remote_addr zone=api:20m   rate=100r/s;
    limit_req_zone $binary_remote_addr zone=hls:20m   rate=200r/s;
    limit_req_zone $binary_remote_addr zone=upload:5m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m  rate=20r/m;
    limit_conn_zone $binary_remote_addr zone=conn:20m;

    # ─── HLS MIME types ─────────────────────────────────────────────────
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t                    ts;
        video/mp4                     mp4;
        image/jpeg                    jpg jpeg;
        image/webp                    webp;
    }

    # ─── Upstream: NestJS API — 3 replica, FIX: keepalive 32 → 128 ──────
    upstream nestjs_api {
        least_conn;                 # Load balancing: eng kam connectionli
        server api:3001;            # Docker Swarm VIP (auto load-balances to 3 replicas)
        keepalive        128;       # FIX: 32 → 128 persistent connections
        keepalive_requests 10000;
        keepalive_timeout  60s;
    }

    # ─── Proxy cache (API response caching) ─────────────────────────────
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=api_cache:10m
                     max_size=1g inactive=60m use_temp_path=off;

    include /etc/nginx/conf.d/*.conf;
}
