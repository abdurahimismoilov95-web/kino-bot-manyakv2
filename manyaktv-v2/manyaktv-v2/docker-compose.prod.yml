# =============================================================================
#  MANYAK TV v2 — PRODUCTION Docker Compose
#  50K-100K users, 10K-15K VIP subscribers uchun optimallashtirilgan
#  Deploy: docker stack deploy -c docker-compose.prod.yml manyaktv
# =============================================================================
version: '3.9'

x-api-env: &api-env
  NODE_ENV:             production
  PORT:                 3001
  DATABASE_URL:         postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_HOST:           redis
  REDIS_PORT:           6379
  REDIS_PASSWORD:       ${REDIS_PASSWORD}
  JWT_SECRET:           ${JWT_SECRET}
  TELEGRAM_BOT_TOKEN:   ${TELEGRAM_BOT_TOKEN}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  SUPER_ADMIN_ID:       ${SUPER_ADMIN_ID}
  UPLOADS_DIR:          /app/uploads
  HLS_OUTPUT_DIR:       /app/hls-output
  FILE_SIGNING_SECRET:  ${FILE_SIGNING_SECRET}
  NGINX_HLS_BASE_URL:   ${CDN_BASE_URL:-http://nginx/hls}
  FRONTEND_URL:         ${FRONTEND_URL}
  APP_URL:              ${APP_URL}
  # TypeORM Pool fixes (hozir: 10 → 50)
  DB_POOL_MIN:          5
  DB_POOL_MAX:          50
  DB_POOL_ACQUIRE:      30000
  DB_POOL_IDLE:         10000
  # HLS auth cache (Redis TTL soniyalarda)
  HLS_AUTH_CACHE_TTL:   30
  # PM2 cluster ichida worker ID
  NODE_CLUSTER_WORKERS: "auto"

services:

  # ────────────────────────────────────────────────────────────────────────────
  #  PostgreSQL 16 — production tuning
  # ────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=4MB
      -c maintenance_work_mem=128MB
      -c wal_buffers=16MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c log_min_duration_statement=500
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          memory: 1G
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ────────────────────────────────────────────────────────────────────────────
  #  Redis 7 — production tuning + maxmemory
  # ────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --tcp-backlog 511
      --tcp-keepalive 60
      --timeout 300
      --save 900 1
      --save 300 10
      --appendonly yes
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M
        reservations:
          memory: 256M
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────────────────────────────────────────
  #  NestJS API — 3 replica, PM2 cluster ichida
  #  MUAMMO: single process edi → FIX: 3 container × 4 PM2 worker = 12 Node
  # ────────────────────────────────────────────────────────────────────────────
  api:
    image: ${DOCKER_REGISTRY:-localhost}/manyaktv-api:${VERSION:-latest}
    restart: always
    environment:
      <<: *api-env
    volumes:
      - uploads_data:/app/uploads
      - hls_data:/app/hls-output
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '4'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
    healthcheck:
      test: ['CMD', 'node', '-e',
             "require('http').get('http://localhost:3001/api/v1/health',r=>process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ────────────────────────────────────────────────────────────────────────────
  #  Telegram Bot microservice
  # ────────────────────────────────────────────────────────────────────────────
  bot:
    image: ${DOCKER_REGISTRY:-localhost}/manyaktv-bot:${VERSION:-latest}
    restart: always
    environment:
      NODE_ENV:           production
      DATABASE_URL:       postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST:         redis
      REDIS_PORT:         6379
      REDIS_PASSWORD:     ${REDIS_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      APP_URL:            ${APP_URL}
      FRONTEND_URL:       ${FRONTEND_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ────────────────────────────────────────────────────────────────────────────
  #  Nginx — LOAD BALANCER + HLS + Static
  #  FIX: upstream 3 NestJS replicas + keepalive 128 (edi 32)
  # ────────────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/hls.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
      - uploads_data:/var/www/uploads:ro
      - hls_data:/var/www/hls:ro
      - ./apps/web/dist:/var/www/angular:ro
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  hls_data:
