# =============================================================================
#  MANYAK TV v2 - Docker Compose (Development)
# =============================================================================
version: '3.9'

services:
  # ---- PostgreSQL ---------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: manyaktv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-manyaktv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB:       ${POSTGRES_DB:-manyaktv}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-manyaktv}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis ---------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: manyaktv-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- NestJS API ---------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: manyaktv-api
    restart: unless-stopped
    environment:
      NODE_ENV:              development
      PORT:                  3001
      DATABASE_URL:          postgresql://${POSTGRES_USER:-manyaktv}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-manyaktv}
      REDIS_HOST:            redis
      REDIS_PORT:            6379
      REDIS_PASSWORD:        ${REDIS_PASSWORD:-}
      JWT_SECRET:            ${JWT_SECRET:-dev_jwt_secret_change_me}
      TELEGRAM_BOT_TOKEN:    ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      SUPER_ADMIN_ID:        ${SUPER_ADMIN_ID:-}
      UPLOADS_DIR:           /app/uploads
      HLS_OUTPUT_DIR:        /app/hls-output
      FILE_SIGNING_SECRET:   ${FILE_SIGNING_SECRET:-dev_sign_secret}
      NGINX_HLS_BASE_URL:    http://nginx/hls
      FRONTEND_URL:          ${FRONTEND_URL:-http://localhost}
      APP_URL:               ${APP_URL:-http://localhost:3001}
    volumes:
      - uploads_data:/app/uploads
      - hls_data:/app/hls-output
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3001:3001'

  # ---- Telegram Bot Microservice ------------------------------------------
  bot:
    build:
      context: .
      dockerfile: infra/docker/bot.Dockerfile
    container_name: manyaktv-bot
    restart: unless-stopped
    environment:
      NODE_ENV:           production
      DATABASE_URL:       postgresql://${POSTGRES_USER:-manyaktv}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-manyaktv}
      REDIS_HOST:         redis
      REDIS_PORT:         6379
      REDIS_PASSWORD:     ${REDIS_PASSWORD:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      APP_URL:            ${APP_URL:-}
      FRONTEND_URL:       ${FRONTEND_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---- Nginx (HLS + Static + Proxy) ---------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: manyaktv-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/hls.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/var/www/uploads:ro
      - hls_data:/var/www/hls:ro
      - ./apps/web/dist:/var/www/angular:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  hls_data:
